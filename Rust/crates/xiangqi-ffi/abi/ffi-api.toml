[[c_declaration]]
name = "pod_types_v1"
code = """
typedef struct xq_ffi_abi_info {
  uint32_t abi_major;
  uint32_t abi_minor;
  uint64_t capabilities;
  uint32_t build_info_format;
  uint32_t reserved;
} xq_ffi_abi_info_t;

typedef struct xq_owned_buffer {
  uint8_t *data;
  size_t len;
  size_t capacity;
  uint64_t allocation_token;
} xq_owned_buffer_t;

#define XQ_OWNED_BUFFER_INIT { NULL, 0u, 0u, UINT64_C(0) }

typedef uint64_t xq_game_handle_t;
#define XQ_GAME_HANDLE_INVALID UINT64_C(0)
typedef uint64_t xq_document_restore_handle_t;
#define XQ_DOCUMENT_RESTORE_HANDLE_INVALID UINT64_C(0)
#define XQ_FFI_SQUARE_COUNT UINT32_C(90)

typedef struct xq_move_v1 {
  uint8_t from;
  uint8_t to;
  uint16_t reserved;
} xq_move_v1_t;

typedef struct xq_square_list_v1 {
  uint32_t count;
  uint32_t reserved;
  uint8_t squares[90];
  uint8_t reserved_tail[2];
} xq_square_list_v1_t;

typedef struct xq_board_snapshot_v1 {
  uint8_t cells[90];
  uint8_t side_to_move;
  uint8_t terminal_kind;
  uint8_t terminal_winner;
  uint8_t checked_side;
  uint8_t reserved0[3];
  uint32_t halfmove_clock;
  uint32_t fullmove_number;
  uint32_t current_node_id;
  uint32_t history_length;
  uint32_t profile_id;
  uint32_t profile_version;
  uint64_t position_hash;
  uint64_t repetition_hash;
} xq_board_snapshot_v1_t;

typedef struct xq_history_summary_v1 {
  uint16_t schema_version;
  uint8_t has_repetition_candidate;
  uint8_t wxf_responsibility_supported;
  uint32_t profile_id;
  uint32_t profile_version;
  uint32_t position_count;
  uint32_t event_count;
  uint64_t current_repetition_hash;
} xq_history_summary_v1_t;

#define XQ_ADJUDICATION_MAX_PLIES UINT32_C(256)

typedef struct xq_adjudication_cycle_v1 {
  uint32_t start_ply;
  uint32_t end_ply;
  uint32_t ply_count;
  uint32_t repeat_count;
} xq_adjudication_cycle_v1_t;

typedef struct xq_adjudication_label_v1 {
  uint8_t mover;
  uint8_t class;
  uint8_t chase_target_id;
  uint8_t chase_target_kind;
  uint8_t chase_protected;
  uint8_t chase_trade_favorable;
  uint8_t was_evading;
  uint8_t resolved_check;
  uint8_t from;
  uint8_t to;
  uint8_t reserved[6];
} xq_adjudication_label_v1_t;

typedef struct xq_adjudication_result_v1 {
  uint16_t schema_version;
  uint16_t reserved0;
  uint32_t profile_id;
  uint32_t profile_version;
  uint32_t verdict;
  uint32_t has_cycle;
  uint32_t label_count;
  uint32_t explanation_truncated;
  xq_adjudication_cycle_v1_t cycle;
  xq_adjudication_label_v1_t labels[XQ_ADJUDICATION_MAX_PLIES];
} xq_adjudication_result_v1_t;

typedef struct xq_mainline_result_v1 {
  uint32_t accepted_plies;
  uint32_t failed_ply;
  uint32_t status;
  uint32_t reserved;
} xq_mainline_result_v1_t;

#define XQ_FFI_VARIATION_CHILD_LIMIT UINT32_C(256)

typedef struct xq_variation_child_v1 {
  uint32_t node_id;
  uint8_t from;
  uint8_t to;
  uint8_t is_selected;
  uint8_t reserved0;
  uint32_t reserved1;
} xq_variation_child_v1_t;

typedef struct xq_variation_child_list_v1 {
  uint32_t count;
  uint32_t reserved;
  xq_variation_child_v1_t children[XQ_FFI_VARIATION_CHILD_LIMIT];
} xq_variation_child_list_v1_t;

typedef struct xq_fen_result_v1 {
  uint32_t status;
  uint32_t field;
  uint32_t reserved0;
  uint32_t reserved1;
} xq_fen_result_v1_t;

#define XQ_FEN_FIELD_NONE UINT32_C(0)
#define XQ_FEN_FIELD_INPUT_BYTES UINT32_C(1)
#define XQ_FEN_FIELD_ASCII UINT32_C(2)
#define XQ_FEN_FIELD_FIELD_COUNT UINT32_C(3)
#define XQ_FEN_FIELD_PLACEMENT UINT32_C(4)
#define XQ_FEN_FIELD_SIDE_TO_MOVE UINT32_C(5)
#define XQ_FEN_FIELD_PLACEHOLDER UINT32_C(6)
#define XQ_FEN_FIELD_HALFMOVE UINT32_C(7)
#define XQ_FEN_FIELD_FULLMOVE UINT32_C(8)
#define XQ_FEN_FIELD_POSITION UINT32_C(9)
"""

[[function]]
name = "xq_ffi_get_abi_info"
return_type = "xq_status_t"
parameters = "xq_ffi_abi_info_t *out_info"
comment = "Writes ABI information to a non-null writable out_info pointer."

[[function]]
name = "xq_ffi_get_capabilities"
return_type = "xq_status_t"
parameters = "uint64_t *out_capabilities"
comment = "Writes the capability bitmap to a non-null writable out_capabilities pointer."

[[function]]
name = "xq_ffi_validate_abi"
return_type = "xq_status_t"
parameters = "uint32_t expected_major, uint32_t minimum_minor"
comment = "Checks the requested major and minimum minor ABI without allocating."

[[function]]
name = "xq_ffi_get_build_info"
return_type = "xq_status_t"
parameters = "xq_owned_buffer_t *out_buffer"
comment = "Requires an empty owned buffer and transfers one bounded build-info buffer on success."

[[function]]
name = "xq_ffi_buffer_release"
return_type = "xq_status_t"
parameters = "xq_owned_buffer_t *buffer"
comment = "Releases exactly one matching Rust-owned buffer and clears it."

[[function]]
name = "xq_game_create_initial"
return_type = "xq_status_t"
parameters = "xq_game_handle_t *out_handle"
comment = "Creates a bounded canonical standard game into an initialized invalid out handle."

[[function]]
name = "xq_game_create_from_fen"
return_type = "xq_status_t"
parameters = "const uint8_t *fen_bytes, uint64_t length, xq_game_handle_t *out_handle"
comment = "Parses strict bounded UTF8 FEN and creates a game only on success."

[[function]]
name = "xq_game_create_from_fen_diagnostic"
return_type = "xq_status_t"
parameters = "const uint8_t *fen_bytes, uint64_t length, xq_game_handle_t *out_handle, xq_fen_result_v1_t *out_result"
comment = "Creates a game transactionally and writes a stable FEN field diagnostic; out_handle and out_result must not overlap."

[[function]]
name = "xq_game_clone"
return_type = "xq_status_t"
parameters = "xq_game_handle_t source, xq_game_handle_t *out_handle"
comment = "Clones one live game into an initialized invalid out handle."

[[function]]
name = "xq_game_destroy"
return_type = "xq_status_t"
parameters = "xq_game_handle_t *handle"
comment = "Destroys one matching live handle exactly once and clears it."

[[function]]
name = "xq_game_get_snapshot"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, xq_board_snapshot_v1_t *out_snapshot"
comment = "Writes one fixed-size immutable board snapshot without per-square calls."

[[function]]
name = "xq_game_get_selectable_squares"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, xq_square_list_v1_t *out_squares"
comment = "Writes all current-side selectable source squares as one bounded batch."

[[function]]
name = "xq_game_get_legal_destinations"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, uint8_t from, xq_square_list_v1_t *out_squares"
comment = "Writes legal destinations for one checked source square as one bounded batch."

[[function]]
name = "xq_game_apply_move"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, xq_move_v1_t move"
comment = "Applies one checked legal move transactionally."

[[function]]
name = "xq_game_undo"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle"
comment = "Undoes one current variation ply without losing retained branches."

[[function]]
name = "xq_game_redo"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle"
comment = "Redoes the selected child variation transactionally."

[[function]]
name = "xq_game_redo_child"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, uint32_t child_node"
comment = "Redoes one explicit checked child node from the current cursor."

[[function]]
name = "xq_game_select_child"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, uint32_t parent_node, uint32_t child_node"
comment = "Selects one retained direct child for future redo without changing the current cursor."

[[function]]
name = "xq_game_navigate"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, uint32_t target_node"
comment = "Navigates through stored variations with exact undo and replay restoration."

[[function]]
name = "xq_game_copy_fen"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, xq_owned_buffer_t *out_buffer"
comment = "Copies canonical current FEN into one bounded Rust-owned buffer."

[[function]]
name = "xq_game_replace_from_fen"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, const uint8_t *fen_bytes, uint64_t length"
comment = "Replaces a live game only after strict bounded FEN parsing succeeds."

[[function]]
name = "xq_game_replace_from_fen_diagnostic"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, const uint8_t *fen_bytes, uint64_t length, xq_fen_result_v1_t *out_result"
comment = "Replaces a live game transactionally and writes a stable FEN field diagnostic on success or failure."

[[function]]
name = "xq_game_copy_ucci_mainline"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, xq_owned_buffer_t *out_buffer"
comment = "Copies the selected root-to-cursor UCCI mainline into a bounded owned buffer."

[[function]]
name = "xq_game_apply_ucci_mainline"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, const uint8_t *ucci_bytes, uint64_t length, xq_mainline_result_v1_t *out_result"
comment = "Parses and applies all UCCI plies transactionally and reports a failing ply."

[[function]]
name = "xq_game_get_history_summary"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, xq_history_summary_v1_t *out_summary"
comment = "Writes versioned base history evidence without a WXF responsibility verdict."

[[function]]
name = "xq_document_restore_set_profile"
return_type = "xq_status_t"
parameters = "xq_document_restore_handle_t restore, uint32_t profile_id, uint32_t profile_version"
comment = "Switches the unpublished restore candidate's profile before any node is replayed (root only)."

[[function]]
name = "xq_game_set_profile"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, uint32_t profile_id, uint32_t profile_version"
comment = "Switches the rule profile transactionally at the root of an empty history (re-seeds repetition identity)."

[[function]]
name = "xq_game_get_adjudication"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, xq_adjudication_result_v1_t *out_result, xq_owned_buffer_t *out_explanation"
comment = "Writes the versioned WXF-style adjudication for the current position (bounded POD batch plus a bounded UTF8 explanation)."

[[function]]
name = "xq_game_get_variation_children"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, uint32_t parent_node, xq_variation_child_list_v1_t *out_children"
comment = "Writes all ordered canonical children of one node as a fixed bounded batch."

[[function]]
name = "xq_game_copy_annotation"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, uint32_t node, xq_owned_buffer_t *out_buffer"
comment = "Copies one bounded UTF8 node annotation into a Rust-owned buffer."

[[function]]
name = "xq_game_set_annotation"
return_type = "xq_status_t"
parameters = "xq_game_handle_t handle, uint32_t node, const uint8_t *annotation_bytes, uint64_t length"
comment = "Sets one bounded UTF8 node annotation transactionally after validating the node and quota."

[[function]]
name = "xq_document_restore_create_from_fen_diagnostic"
return_type = "xq_status_t"
parameters = "const uint8_t *fen_bytes, uint64_t length, xq_document_restore_handle_t *out_restore, xq_fen_result_v1_t *out_result"
comment = "Starts one unpublished bounded Rust document restore candidate; output locations must not overlap."

[[function]]
name = "xq_document_restore_append_node"
return_type = "xq_status_t"
parameters = "xq_document_restore_handle_t restore, uint32_t expected_node, uint32_t parent_node, xq_move_v1_t move"
comment = "Appends one expected stable node to an unpublished restore candidate after Rust legality validation."

[[function]]
name = "xq_document_restore_set_annotation"
return_type = "xq_status_t"
parameters = "xq_document_restore_handle_t restore, uint32_t node, const uint8_t *annotation_bytes, uint64_t length"
comment = "Sets one bounded annotation on an unpublished restore candidate."

[[function]]
name = "xq_document_restore_navigate"
return_type = "xq_status_t"
parameters = "xq_document_restore_handle_t restore, uint32_t target_node"
comment = "Sets the saved cursor on an unpublished restore candidate after every node exists."

[[function]]
name = "xq_document_restore_select_child"
return_type = "xq_status_t"
parameters = "xq_document_restore_handle_t restore, uint32_t parent_node, uint32_t child_node"
comment = "Sets one canonical redo selection on an unpublished restore candidate."

[[function]]
name = "xq_document_restore_finish"
return_type = "xq_status_t"
parameters = "xq_document_restore_handle_t *restore, xq_game_handle_t *out_game"
comment = "Publishes a fully valid restore candidate into an empty game handle; output locations must not overlap."

[[function]]
name = "xq_document_restore_destroy"
return_type = "xq_status_t"
parameters = "xq_document_restore_handle_t *restore"
comment = "Destroys one unpublished restore candidate exactly once and clears its handle."
