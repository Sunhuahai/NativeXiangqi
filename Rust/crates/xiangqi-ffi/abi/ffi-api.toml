[abi]
name = "xiangqi_ffi"
major = 1
minor = 1
metadata_schema = 2
build_info_format = 1
max_build_info_bytes = 1024
max_live_buffers = 4096
max_live_games = 64
max_input_bytes = 65536
max_owned_buffer_bytes = 65536
max_owned_buffer_total_bytes = 4194304
ownership_token_bits = 64
deterministic_features = ["deterministic-ffi-v1"]

[[capability]]
name = "ABI_INFO"
value = 1

[[capability]]
name = "BUILD_INFO"
value = 2

[[capability]]
name = "OWNED_BUFFERS"
value = 4

[[capability]]
name = "GAME_HANDLES"
value = 8

[[capability]]
name = "BATCH_RULES"
value = 16

[[capability]]
name = "FEN_UCCI"
value = 32

[[capability]]
name = "BASE_HISTORY"
value = 64

